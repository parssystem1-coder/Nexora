services:
  postgres:
    image: postgres:17-alpine
    environment:
      # This bootstrap user is a Postgres superuser (how the official image
      # works) and is used only to run platform/db/init/*.sql on first
      # startup. Nothing else — app and migrations use the roles that
      # script creates (nexora_migrate, nexora_app), never this one. See
      # DECISION_LOG.md "RLS: FORCE ROW LEVEL SECURITY or a non-owner app role".
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_bootstrap_dev_only
      POSTGRES_DB: nexora
    ports:
      # Host port 5433, not 5432: avoids colliding with a developer's
      # pre-existing local PostgreSQL install. See DECISION_LOG.md.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./platform/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexora"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
