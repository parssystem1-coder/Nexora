services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_dev_only
      POSTGRES_DB: nexora
    ports:
      # Host port 5433, not 5432: avoids colliding with a developer's
      # pre-existing local PostgreSQL install. See DECISION_LOG.md.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_data:
