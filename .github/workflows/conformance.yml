name: Conformance

on:
  pull_request:
  push:
    branches: [main]

env:
  # Matches docker-compose.yml's postgres service (host port 5433) and the
  # roles platform/db/init/001_roles.sql creates on first container start.
  # Two roles, deliberately — see DECISION_LOG.md "RLS: FORCE ROW LEVEL
  # SECURITY or a non-owner app role": nexora_app (NOSUPERUSER, NOBYPASSRLS,
  # never an owner) is what the app and its tests connect as; nexora_migrate
  # owns the schema and runs migrations only.
  DATABASE_URL: postgresql://nexora_app:nexora_app_dev_only@localhost:5433/nexora
  MIGRATE_DATABASE_URL: postgresql://nexora_migrate:nexora_migrate_dev_only@localhost:5433/nexora

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL and Redis (docker-compose.yml)
        run: docker compose up -d --wait
      # The compose container above starts with no schema at all - it is a
      # brand-new volume on every run. This step is therefore also the
      # "every migration applies cleanly from an empty database" proof
      # CLAUDE.md's local verification ritual (typecheck && test &&
      # conformance && db:migrate) has otherwise only ever been done by hand,
      # against a throwaway database on the maintainer's machine. Doing it
      # here means that guarantee now holds on every push, for free, instead
      # of only when someone remembers to check it locally.
      - name: Apply migrations (also proves every migration applies cleanly from an empty database)
        run: npm run db:migrate
      # RISK_REGISTER.md R-008 / ADR-039 (OPEN, pool sizing). R-008 burned four
      # occurrences and 165 local reproduction attempts on a CI-only failure
      # while the two numbers that separate CI from a developer machine -
      # how many test workers run at once, and how many connections the server
      # allows - were recorded nowhere for either environment. max_connections
      # appeared nowhere in this repository at all. This step is diagnostic
      # output only: it asserts nothing and cannot fail the build.
      - name: Environment differential (R-008 / ADR-039 evidence)
        run: npx tsx tools/diagnostics/environment-report.ts

      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: No devDependency import in dist
        run: npm run check:dist-deps
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      # The sampler is the pg_stat_activity half of the falsifying test R-008's
      # F-3 addendum named and nobody ran. It runs alongside the suite, prints a
      # rolling peak, and is killed afterwards; `npm test`'s own exit status is
      # what this step exits with, so the sampler can never turn a green suite
      # red or a red one green.
      - name: Harness self-test (proves every rule detects its fixture, incl. against real PostgreSQL)
        run: |
          npx tsx tools/diagnostics/pg-activity-sample.ts &
          sampler=$!
          set +e
          npm test
          status=$?
          set -e
          kill "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true
          exit $status
      - name: Conformance scan of real source tree
        if: always()
        run: npm run conformance
      # RISK_REGISTER.md is one large Markdown table whose rows have broken its
      # own rendering three times, by three different mechanisms, each caught
      # only by a human remembering to run an ad-hoc awk check. AGENTS.md
      # section 2: rules expressed only as prose are not enforceable on a long
      # task. Deliberately NOT a conformance rule - ADR-030 scopes that harness
      # to architecture and schema; this follows the graph/openapi/dist-deps
      # convention for artifact-integrity checks instead.
      - name: Risk register table integrity
        if: always()
        run: npm run check:register

      # ADR-041's ruling keeps the append-only tables partition-COMPATIBLE and
      # does not partition them, so this matches nothing today and is free. It
      # exists because Session 9 proved (2026-09-03) that a partition is NOT
      # protected by its parent's RLS policy, and that 001_roles.sql's ALTER
      # DEFAULT PRIVILEGES hands nexora_app full DML on every partition in
      # public automatically - so a partitioning migration that looks exactly
      # like the correct audit_events migration opens a cross-tenant hole.
      # Outside the conformance harness deliberately: exceptions.json is applied
      # generically to every rule, and an entry silencing this one would silence
      # a real cross-tenant hole. See the tool's doc comment.
      - name: Partition tenant-isolation tripwire (ADR-041, R-042)
        if: always()
        run: npm run check:partitions

      - name: Project graph up to date
        if: always()
        run: npm run graph -- --check
      - name: OpenAPI artifact up to date (ADR-033)
        if: always()
        run: npm run openapi -- --check
      - name: Stop PostgreSQL and Redis
        if: always()
        run: docker compose down -v
      - name: Upload exceptions report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-exceptions-report
          path: conformance-exceptions-report.md
