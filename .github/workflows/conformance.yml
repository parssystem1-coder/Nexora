name: Conformance

on:
  pull_request:
  push:
    branches: [main]

env:
  # Matches docker-compose.yml's postgres service (host port 5433) and the
  # roles platform/db/init/001_roles.sql creates on first container start.
  # Two roles, deliberately — see DECISION_LOG.md "RLS: FORCE ROW LEVEL
  # SECURITY or a non-owner app role": nexora_app (NOSUPERUSER, NOBYPASSRLS,
  # never an owner) is what the app and its tests connect as; nexora_migrate
  # owns the schema and runs migrations only.
  DATABASE_URL: postgresql://nexora_app:nexora_app_dev_only@localhost:5433/nexora
  MIGRATE_DATABASE_URL: postgresql://nexora_migrate:nexora_migrate_dev_only@localhost:5433/nexora

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL (docker-compose.yml)
        run: docker compose up -d --wait
      # The compose container above starts with no schema at all - it is a
      # brand-new volume on every run. This step is therefore also the
      # "every migration applies cleanly from an empty database" proof
      # CLAUDE.md's local verification ritual (typecheck && test &&
      # conformance && db:migrate) has otherwise only ever been done by hand,
      # against a throwaway database on the maintainer's machine. Doing it
      # here means that guarantee now holds on every push, for free, instead
      # of only when someone remembers to check it locally.
      - name: Apply migrations (also proves every migration applies cleanly from an empty database)
        run: npm run db:migrate
      - name: Type check
        run: npm run typecheck
      - name: Harness self-test (proves every rule detects its fixture, incl. against real PostgreSQL)
        run: npm test
      - name: Conformance scan of real source tree
        if: always()
        run: npm run conformance
      - name: Project graph up to date
        if: always()
        run: npm run graph -- --check
      - name: OpenAPI artifact up to date (ADR-033)
        if: always()
        run: npm run openapi -- --check
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
      - name: Upload exceptions report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-exceptions-report
          path: conformance-exceptions-report.md
