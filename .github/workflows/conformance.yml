name: Conformance

on:
  pull_request:
  push:
    branches: [main]

env:
  # Matches docker-compose.yml's postgres service (host port 5433, see DECISION_LOG.md).
  DATABASE_URL: postgresql://nexora:nexora_dev_only@localhost:5433/nexora
  CONFORMANCE_TEST_DATABASE_URL: postgresql://nexora:nexora_dev_only@localhost:5433/nexora

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start PostgreSQL (docker-compose.yml)
        run: docker compose up -d --wait
      - name: Type check
        run: npm run typecheck
      - name: Harness self-test (proves every rule detects its fixture, incl. against real PostgreSQL)
        run: npm test
      - name: Conformance scan of real source tree
        run: npm run conformance
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
      - name: Upload exceptions report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-exceptions-report
          path: conformance-exceptions-report.md
